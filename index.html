<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EasyQ CRM — Boshqaruv paneli</title>
    <meta
      name="description"
      content="EasyQ CRM for managing bookings, employees, schedules, and client visit analytics."
    />
    <!--
      Icons and theme colour are safe to set statically for every route: a booking page wants a
      favicon and an iOS home-screen icon too. The MANIFEST is not — it is added in main.tsx
      only for the CRM, so a customer's booking page never offers to install the owner's CRM.
      iOS ignores the manifest for touch icons and reads this link instead.
    -->
    <link rel="icon" type="image/svg+xml" href="/icons/easyq-icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#b4d94e" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          document.documentElement.setAttribute(
            'data-theme',
            localStorage.getItem('easyq_crm_theme') || 'light',
          );
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"><div class="boot"><div class="spin"></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
