name = "easyq-crm"
main = "src/worker.ts"
compatibility_date = "2026-04-06"

# Routing is managed in the Cloudflare dashboard, deliberately not here, so a
# routine code deploy can never reshuffle live hostnames:
#   Custom domain : crm.easyq.uz
#   Route         : *.easyq.uz/*   (zone easyq.uz)  → per-tenant business CRMs

[vars]
# The zone every "today" and "now" in the CRM is measured in. It was unset in production,
# so the Worker fell back to UTC — five hours behind the businesses — which made the
# calendar show the previous day from 19:00 local until midnight, and would have let the
# booking page keep offering slots that had already passed.
#
# Committed here rather than left as a dashboard variable so a redeploy cannot silently
# drop it again. Asia/Tashkent, not the README's Asia/Almaty: same UTC+5 offset today, but
# this is an Uzbek product and Kazakhstan could diverge.
APP_TIMEZONE = "Asia/Tashkent"

# Who receives the feedback queue and is the only account allowed to moderate it.
#
# Here rather than in the dashboard for exactly the reason written above APP_TIMEZONE: a plain var
# set through the dashboard is dropped by the next deploy that does not declare it, and this repo
# has already lost one that way. A Telegram user id is not a credential — it is the account's public
# handle in numeric form — so committing it costs nothing. The TOKEN is a secret and stays one.
FEEDBACK_CHAT_ID = "8789277873"

# Keep the logs. `wrangler tail` cannot run on the dev machine — npm ci fails there, which is why
# migrations go through the dashboard console — so without this the only way to see why something
# failed in production was to guess. The feedback bot cost an afternoon of guessing: every failure
# path in it already writes a console.log naming the exact cause, and none of them were readable.
[observability]
enabled = true
head_sampling_rate = 1

[assets]
directory = "./dist"
binding = "ASSETS"
# REQUIRED for the public booking page. `/booking` is a client-side route with no file
# behind it, and the default not_found_handling ("none") would 404 it. Unmatched paths now
# serve index.html so main.tsx can dispatch on the path.
#
# This does not weaken the unknown-subdomain 404 below: run_worker_first means the Worker
# vets the hostname first and returns its own response before assets are ever consulted.
not_found_handling = "single-page-application"
# REQUIRED for per-tenant subdomains. By default the asset router answers any
# request matching a file in ./dist *before* the Worker runs, so `/` on an
# unclaimed subdomain would serve the CRM login SPA instead of the Worker's
# unknown-workspace 404. Running the Worker first is what lets it vet the
# hostname. Non-tenant hosts still fall through to env.ASSETS.fetch() unchanged.
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "easyqueue_db"
database_id = "3d22cbfd-ec17-4ddc-9214-f422ba342adf"
